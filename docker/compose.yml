# The whole Bag stack, restart-on-boot.
#   cd ~/dnd-tts && docker compose -f docker/compose.yml up -d --build
# tts = Higgs Audio v3 on GPU 1, host :8010 (the TTS may only read reference
#       clips under /refs — user-created voices live in /refs/user)
# app = render service + CLI on host :8020 (host networking: it talks to the TTS,
#       ollama, whisper and the lifeos broker on localhost). CPU only.
name: bag
services:
  tts:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: bag-tts:local
    container_name: bag-tts
    restart: unless-stopped
    ports: ["8010:8000"]
    volumes:
      - ${HOME}/dnd-tts/models/higgs-v3:/model:ro
      - ${HOME}/dnd-tts/refs:/refs:ro
    environment:
      - CUDA_VISIBLE_DEVICES=1
      - SGLANG_OMNI_HIGGS_REF_CODE_CACHE=1   # cache reference-clip codes across calls
    command: ["serve", "--model-path", "/model", "--allowed-local-media-path", "/refs",
              "--host", "0.0.0.0", "--port", "8000"]
    shm_size: 16g
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
  # HTTPS front for the app. WHY it exists: browsers expose
  # navigator.mediaDevices only in a secure context, so the speaker-output
  # picker is invisible over plain http on the LAN. It answers on :8444 because
  # :8443 is the whisper STT endpoint. Plain :8020 keeps working.
  tls:
    image: caddy:2-alpine
    container_name: bag-tls
    restart: unless-stopped
    network_mode: host
    volumes:
      - ${HOME}/dnd-tts/docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - ${HOME}/dnd-tts/cache/caddy:/data
    depends_on: [app]

  app:
    build:
      context: ..
      dockerfile: docker/app.Dockerfile
    image: bag-app:local
    container_name: bag-app
    restart: unless-stopped
    network_mode: host
    volumes:
      - ${HOME}/dnd-tts/refs:/refs          # rw: voice lock writes /refs/<voice>/ref.wav for the TTS
      - ${HOME}/dnd-tts/data:/data          # voice.yaml, renders, app.db
      - ${HOME}/dnd-tts/cache:/cache        # numba/torch caches, survive rebuilds
    environment:
      - BAG_DATA=/data
      - BAG_TTS_URL=http://127.0.0.1:8010
    depends_on: [tts]
